<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.png" type="image/png">
<title>EphemChat</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ===== Modal de apodo ===== -->
<div id="overlay" class="overlay" hidden>
  <div class="modal">
    <h2>Unirte a <span id="modal-room" class="mono">/sala</span></h2>
    <p>Elegí un apodo. Es temporal y no se guarda nada.</p>
    <input id="modal-nick" type="text" maxlength="32" placeholder="tu apodo" autocomplete="off" spellcheck="false">
    <div class="actions">
      <button class="ghost" id="modal-cancel">Cancelar</button>
      <button class="primary" id="modal-join">Unirse</button>
    </div>
  </div>
</div>

<!-- ===== Portada ===== -->
<div id="landing" class="landing" hidden>
  <div class="brand">
    <img class="mark" src="/icon.png" alt="ephemchat">
  </div>
  <p class="tagline">Chat efímero por salas · sin registro · sin historial · <code>/tusala</code></p>

  <div class="rooms" id="rooms"></div>

  <div class="join">
    <input id="join-input" type="text" maxlength="64" placeholder="crear o unirse a una sala…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="join-btn">Entrar</button>
  </div>
</div>

<!-- ===== Chat ===== -->
<div id="chat" class="chat" hidden>
  <header class="topbar">
    <a class="back" href="/" title="Volver">←</a>
    <div class="room-label">/<b id="chat-room"></b></div>
    <div class="spacer"></div>
    <span class="status" id="status"><span class="dot"></span><span id="status-text">conectando…</span></span>
    <input class="nick" id="chat-nick" type="text" maxlength="32" placeholder="apodo" autocomplete="off" spellcheck="false">
    <button class="icon-btn" id="users-toggle" title="Mostrar / ocultar usuarios">usuarios</button>
  </header>

  <div class="layout">
    <main class="messages" id="messages"></main>

    <aside class="users" id="users">
      <header><h2>Usuarios</h2><span class="n" id="users-count">0</span></header>
      <ul id="users-list"></ul>
    </aside>
  </div>

  <footer class="composer">
    <div class="toolbar">
      <button class="icon-btn" id="code-btn" title="Enviar como bloque de código">&lt;/&gt;</button>
      <button class="icon-btn on" id="md-toggle" title="Activar / desactivar Markdown">md</button>
      <select id="lang" title="Lenguaje del bloque de código">
        <option value="">auto</option>
        <option value="text">text</option>
        <option value="js">js</option>
        <option value="ts">ts</option>
        <option value="py">py</option>
        <option value="php">php</option>
        <option value="html">html</option>
        <option value="css">css</option>
        <option value="json">json</option>
        <option value="bash">bash</option>
        <option value="sql">sql</option>
        <option value="java">java</option>
        <option value="c">c</option>
        <option value="cpp">cpp</option>
        <option value="go">go</option>
        <option value="rust">rust</option>
      </select>
      <button class="icon-btn" id="file-btn" title="Compartir archivo (efímero)">adjuntar</button>
      <input id="file-input" type="file" hidden>
    </div>
    <div id="upload-progress" class="upload-progress" hidden></div>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Escribí un mensaje… (Enter envía · Shift+Enter salto)"></textarea>
      <button class="send" id="send">Enviar</button>
    </div>
    <div class="hint">Markdown <b>activado</b> · bloques de código con ``` · archivos efímeros · nada queda guardado.</div>
  </footer>
</div>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
